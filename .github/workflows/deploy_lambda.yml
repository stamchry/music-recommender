name: Continuous Deployment · AWS Lambda Serverless Inference

on:
  # Automatically deploy when inference code or dependencies are pushed to main
  push:
    branches:
      - main
    paths:
      - 'src/lambda_function.py'
      - 'deploy/lambda_requirements.txt'
      - '.github/workflows/deploy_lambda.yml'
      
  # Automatically deploy/refresh after our weekly retraining job completes!
  workflow_run:
    workflows: ["Automated Weekly Recommender Retraining & Cloud Sync"]
    types:
      - completed

  # Enables manual button execution directly from the GitHub Actions web UI!
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # Run only if triggered manually, on push, or if the parent weekly training succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME || 'MusicRecommenderInference' }}

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: 🏗️ Compile Lambda Runtime Deployment Bundle
        run: |
          echo "Installing minimal serverless runtime dependencies into staging folder..."
          mkdir -p package
          # Install compiled Linux x86_64 binary wheels suitable for AWS Lambda
          pip install -r deploy/lambda_requirements.txt -t package/ --no-cache-dir
          
          echo "Pruning extraneous test suites and bytecode to optimize bundle footprint..."
          find package/ -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find package/ -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find package/ -name "*.pyc" -delete 2>/dev/null || true
          find package/ -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          
          echo "Copying recommendation inference entry point..."
          cp src/lambda_function.py package/
          
          echo "Compressing deployment bundle..."
          cd package
          zip -r -9 ../deployment_bundle.zip .
          cd ..
          
          echo "Package inspection:"
          ls -lh deployment_bundle.zip
          
      - name: 🚀 Deploy to AWS Lambda Free Tier Endpoint via S3 Staging
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_S3_BUCKET" ]; then
            echo "⚠️ AWS secrets (or AWS_S3_BUCKET) not configured in repository settings. Skipping cloud push."
            exit 0
          fi
          
          echo "Uploading compiled deployment bundle to S3 staging (s3://$AWS_S3_BUCKET) to bypass direct CLI 50MB limits..."
          aws s3 cp deployment_bundle.zip "s3://$AWS_S3_BUCKET/deploy/deployment_bundle.zip"
          
          echo "Updating AWS Lambda function from S3 staged artifact..."
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$AWS_S3_BUCKET" \
            --s3-key "deploy/deployment_bundle.zip" \
            --publish
            
          echo "✨ AWS Lambda endpoint successfully updated with zero server downtime!"
